name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: app version, device/OS, staging or production, commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, emails and other personal data first.
